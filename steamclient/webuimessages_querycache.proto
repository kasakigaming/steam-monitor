syntax = "proto2";

import "steammessages_base.proto";
import "webuimessages_base.proto";

option cc_generic_services = true;
option optimize_for = SPEED;

service QueryCache {
    rpc GetDocument(CQueryCache_GetDocument_Request) returns (CQueryCache_GetDocument_Response);
    rpc SetDocument(CQueryCache_SetDocument_Notification) returns (WebUINoResponse);
}

message CQueryCache_GetDocument_Request {
    optional EQueryCache cache = 1;
    repeated string key_parts = 2;
    optional uint32 max_age_seconds = 3;
}

message CQueryCache_GetDocument_Response {
    optional bytes data = 1;
}

message CQueryCache_SetDocument_Notification {
    optional EQueryCache cache = 1;
    repeated string key_parts = 2;
    optional bytes data = 3;
}

enum EQueryCache {
    k_eQueryCacheInvalid = 0;
    k_eQueryCacheAchievements = 1;
    k_eQueryCacheStoreItems = 2;
}
